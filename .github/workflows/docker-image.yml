name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt pip-audit
      - name: Check installed dependencies
        run: python -m pip check
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Lint backend
        run: ruff check backend/app backend/tests
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Typecheck
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: "ci-db-password-012345678901234567890123"
      JWT_SECRET: "ci-jwt-secret-0123456789012345678901234567890123456789012345678901"
      TOTP_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
        env:
          DB_PASSWORD: "ci-db-password-012345678901234567890123"
          JWT_SECRET: "ci-jwt-secret-0123456789012345678901234567890123456789012345678901"
          TOTP_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Shutdown stack
        if: always()
        run: docker compose down -v
        env:
          DB_PASSWORD: "ci-db-password-012345678901234567890123"
          JWT_SECRET: "ci-jwt-secret-0123456789012345678901234567890123456789012345678901"
          TOTP_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
